server {
    listen 127.0.0.1:8080;
    server_name localhost;

    root ./www/site1;
    error_page 404 /errors/404.html;
    client_max_body_size 5M;

    location / {
        index first.html second.html third.html;
    }

    location /old-page {
        return 301 /;
    }

    location /cgi-bin {
        allow_methods GET POST;
        cgi_extension .py;
        cgi_path /usr/bin/python3;
        autoindex on;
    }

    location /upload {
        allow_methods POST;
        upload_store ./www/uploads;
    }
}
